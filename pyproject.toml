[project]
name = "abi3info"
version = "2026.09.25"
description = "A library for abi3 and other CPython API information"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "William Woodruff", email = "william@yossarian.net" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Documentation = "https://woodruffw.github.io/abi3info/"
Homepage = "https://pypi.org/project/abi3info/"
Issues = "https://github.com/woodruffw/abi3info/issues"
Source = "https://github.com/woodruffw/abi3info"

[dependency-groups]
dev = [
  "toml",
  { include-group = "doc" },
  { include-group = "lint" },
  { include-group = "test" },
]
doc = ["pdoc >= 13.0.0"]
lint = [
  "bandit",
  "interrogate",
  "ruff",
  "ty>=0.0.84",
]
test = ["coverage[toml]", "pretend", "pytest", "pytest-cov"]

[build-system]
requires = ["flit_core >=3.11,<4"]
build-backend = "flit_core.buildapi"

[tool.bandit]
exclude_dirs = ["./test"]

[tool.interrogate]
exclude = ["env", "test", "codegen"]
ignore-semiprivate = true
fail-under = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "I", "N", "YTT", "BLE", "C4", "SIM"]
